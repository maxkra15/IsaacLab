workflow:
  name: "{{ workflow_name }}"
  timeout:
    exec_timeout: 1h
    queue_timeout: 1h
  resources:
    smoke:
      gpu: 1
      cpu: 14
      memory: 110Gi
      storage: 256Gi
      platform: ovx-l40s
  tasks:
  - name: smoke
    image: "{{ image }}"
    resource: smoke
    command: ["bash", "/tmp/run_smoke.sh"]
    environment:
      ACCEPT_EULA: Y
      OMNI_KIT_ACCEPT_EULA: "YES"
      PYTHONUNBUFFERED: "1"
    files:
    - path: /tmp/run_smoke.sh
      contents: |
        set -euo pipefail
        git clone --depth 1 --branch "{{ benchmark_branch }}" \
          https://github.com/maxkra15/IsaacLab.git /tmp/isaaclab-mpm-benchmark
        cp -a /tmp/isaaclab-mpm-benchmark/. /workspace/isaaclab/
        cd /workspace/isaaclab
        uv sync --locked --inexact --no-install-local --no-progress
        python_cmd=(/workspace/isaaclab/.venv/bin/python)
        "${python_cmd[@]}" -c \
          "import importlib.metadata as m; from isaaclab.app import launch_simulation; assert m.version('newton') == '1.6.0rc1'; assert m.version('warp-lang') == '1.17.0'; print('imports-ok', m.version('newton'), m.version('warp-lang'), m.version('newton-usd-schemas'))"
        "${python_cmd[@]}" tools/mpm_benchmarks/run_suite.py \
          --manifest tools/mpm_benchmarks/osmo_l40s_smoke.toml \
          --output_root "{{output}}" \
          --suite_id "osmo-{{workflow_id}}-smoke"

default-values:
  workflow_name: mpm-benchmark-smoke
  image: nvcr.io/nvidian/octi-isaac-lab:factory@sha256:48c339c6dd48f07aa067d55dd237aefda17acc44e43ca498def8082d34da44a1
  benchmark_branch: maximiliank/mpm-benchmark-osmo-20260909
