[suite]
name = "Newton MPM L40S integration smoke (non-reportable)"
randomization_seed = 20260909
max_initial_gpu_memory_used_mib = 4096
max_initial_gpu_utilization_percent = 25

[defaults]
repetitions = 1
device = "cuda:0"
num_envs = 1
voxel_size = 0.1
particles_per_cell = 2.0
dt = 0.008333333333333333
substeps = 1
warmup_steps = 5
warmup_min_wall_s = 0.25
measurement_duration = 0.25
timing_batch_steps = 10
gpu_monitor_interval_ms = 100
max_iterations = 250
tolerance = 0.0001
capacity_factor = 4.0
collider_margin = 0.05
disable_cuda_graph = false
project_outside_colliders = true
preflight_max_total_particles = 4096
preflight_max_active_cell_count = 4096
preflight_max_leaf_node_count = 1024
preflight_max_lower_node_count = 128
preflight_max_upper_node_count = 32

[[sweeps]]
name = "integration_smoke"
x_parameter = "num_envs"
x_unit = "environments"

[[sweeps.cases]]
id = "env_0001_smoke"
label = "1 environment"
x_value = 1
num_envs = 1
