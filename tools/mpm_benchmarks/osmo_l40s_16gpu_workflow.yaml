# Sixteen one-GPU tasks execute independent shards. Each GPU runs its assigned
# points sequentially. A lightweight downstream task joins the raw result sets
# after all 16 benchmark GPUs have been released.

workflow:
  name: "{{ workflow_name }}"
  timeout:
    exec_timeout: 8h
    queue_timeout: 4h
  resources:
    benchmark:
      gpu: 1
      cpu: 14
      memory: 110Gi
      storage: 256Gi
      platform: "{{ platform }}"
    aggregate:
      gpu: 1
      cpu: 4
      memory: 16Gi
      storage: 128Gi
      platform: "{{ platform }}"

  tasks:
  {% for shard_index in range(16) %}
  - name: "shard-{{ '%02d' | format(shard_index) }}"
    image: "{{ image }}"
    resource: benchmark
    command: ["bash", "/tmp/run_benchmark_shard.sh", "{{ shard_index }}"]
    environment:
      ACCEPT_EULA: Y
      OMNI_KIT_ACCEPT_EULA: "YES"
      PYTHONUNBUFFERED: "1"
    files:
    - path: /tmp/run_benchmark_shard.sh
      contents: |
        set -uo pipefail

        output_root="{{output}}"
        mkdir -p "${output_root}"
        repo_dir=/tmp/isaaclab-mpm-benchmark
        if ! git clone --depth 1 --branch "{{ benchmark_branch }}" \
          https://github.com/maxkra15/IsaacLab.git "${repo_dir}"; then
          echo "git clone failed" > "${output_root}/task_failure.txt"
          exit 0
        fi

        env_dir=/workspace/isaaclab/.venv
        cd "${repo_dir}"
        if ! UV_PROJECT_ENVIRONMENT="${env_dir}" uv sync --locked --inexact --no-progress; then
          echo "uv sync failed" > "${output_root}/task_failure.txt"
          exit 0
        fi

        source_path=""
        for package_dir in source/*; do
          if [ -d "${package_dir}" ]; then
            source_path="${PWD}/${package_dir}:${source_path}"
          fi
        done
        export PYTHONPATH="${source_path}${PYTHONPATH:+:${PYTHONPATH}}"

        shard_index="$1"
        if ! "${env_dir}/bin/python" tools/mpm_benchmarks/run_suite.py \
          --manifest "tools/mpm_benchmarks/{{ manifest }}" \
          --output_root "${output_root}" \
          --suite_id "osmo-{{workflow_id}}-shard-${shard_index}" \
          --repetitions "{{ repetitions }}" \
          --num_shards 16 \
          --shard_index "${shard_index}"; then
          echo "suite runner failed" > "${output_root}/task_failure.txt"
        fi
        exit 0
  {% endfor %}

  - name: aggregate
    image: python:3.12-slim
    resource: aggregate
    command: ["bash", "/tmp/aggregate.sh"]
    files:
    - path: /tmp/aggregate.sh
      contents: |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq git
        git clone --depth 1 --branch "{{ benchmark_branch }}" \
          https://github.com/maxkra15/IsaacLab.git /tmp/isaaclab-mpm-benchmark
        cd /tmp/isaaclab-mpm-benchmark/tools/mpm_benchmarks
        python merge_osmo_shards.py \
          --workflow_id "{{workflow_id}}" \
          --output "{{output}}/mpm_benchmark_{{workflow_id}}" \
          --input "{{input:0}}" \
          --input "{{input:1}}" \
          --input "{{input:2}}" \
          --input "{{input:3}}" \
          --input "{{input:4}}" \
          --input "{{input:5}}" \
          --input "{{input:6}}" \
          --input "{{input:7}}" \
          --input "{{input:8}}" \
          --input "{{input:9}}" \
          --input "{{input:10}}" \
          --input "{{input:11}}" \
          --input "{{input:12}}" \
          --input "{{input:13}}" \
          --input "{{input:14}}" \
          --input "{{input:15}}" \
          --expected_input_count 16
    inputs:
    {% for shard_index in range(16) %}
    - task: "shard-{{ '%02d' | format(shard_index) }}"
    {% endfor %}

default-values:
  workflow_name: mpm-benchmark-qualification
  image: nvcr.io/nvidian/octi-isaac-lab:factory@sha256:48c339c6dd48f07aa067d55dd237aefda17acc44e43ca498def8082d34da44a1
  benchmark_branch: maximiliank/mpm-benchmark-osmo-20260909
  manifest: osmo_l40s_qualification.toml
  repetitions: 1
  platform: ovx-l40s
