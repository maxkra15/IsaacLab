# Eight two-GPU tasks launch sixteen independent shards. Each GPU executes its
# assigned points sequentially; a CPU task joins the raw result sets afterward.

workflow:
  name: "{{ workflow_name }}"
  timeout:
    exec_timeout: 8h
    queue_timeout: 4h
  resources:
    benchmark:
      gpu: 2
      cpu: 28
      memory: 220Gi
      storage: 256Gi
      platform: ovx-l40s
    aggregate:
      gpu: 2
      cpu: 4
      memory: 16Gi
      storage: 128Gi
      platform: ovx-l40s

  tasks:
  {% for task_index in range(8) %}
  - name: "shard-pair-{{ '%02d' | format(task_index) }}"
    image: "{{ image }}"
    resource: benchmark
    command: ["bash", "/tmp/run_benchmark_shard_pair.sh", "{{ task_index }}"]
    environment:
      ACCEPT_EULA: Y
      OMNI_KIT_ACCEPT_EULA: "YES"
      PYTHONUNBUFFERED: "1"
    files:
    - path: /tmp/run_benchmark_shard_pair.sh
      contents: |
        set -uo pipefail

        output_root="{{output}}"
        mkdir -p "${output_root}"
        repo_dir="/tmp/isaaclab-mpm-benchmark"
        if ! git clone --depth 1 --branch "{{ benchmark_branch }}" \
          https://github.com/maxkra15/IsaacLab.git "${repo_dir}"; then
          echo "git clone failed" > "${output_root}/task_failure.txt"
          exit 0
        fi
        cd "${repo_dir}"

        source_path=""
        for package_dir in source/*; do
          if [ -d "${package_dir}" ]; then
            source_path="${repo_dir}/${package_dir}:${source_path}"
          fi
        done
        export PYTHONPATH="${source_path}${PYTHONPATH:+:${PYTHONPATH}}"

        python_bin="/workspace/isaaclab/.venv/bin/python"
        if [ ! -x "${python_bin}" ]; then
          python_bin="$(command -v python3)"
        fi
        task_index="$1"
        first_shard=$((task_index * 2))
        second_shard=$((first_shard + 1))

        run_shard() {
          local shard_index="$1"
          local gpu_index="$2"
          CUDA_VISIBLE_DEVICES="${gpu_index}" "${python_bin}" tools/mpm_benchmarks/run_suite.py \
            --manifest "tools/mpm_benchmarks/{{ manifest }}" \
            --output_root "${output_root}" \
            --suite_id "osmo-{{workflow_id}}-shard-${shard_index}" \
            --repetitions "{{ repetitions }}" \
            --num_shards 16 \
            --shard_index "${shard_index}"
          local status=$?
          if [ "${status}" -ne 0 ]; then
            echo "suite runner exited with ${status}" > "${output_root}/task_failure_${shard_index}.txt"
          fi
        }

        run_shard "${first_shard}" 0 &
        first_pid=$!
        run_shard "${second_shard}" 1 &
        second_pid=$!
        wait "${first_pid}"
        wait "${second_pid}"
        exit 0
  {% endfor %}

  - name: aggregate
    image: python:3.12-slim
    resource: aggregate
    command: ["bash", "/tmp/aggregate.sh"]
    files:
    - path: /tmp/aggregate.sh
      contents: |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq git
        git clone --depth 1 --branch "{{ benchmark_branch }}" \
          https://github.com/maxkra15/IsaacLab.git /tmp/isaaclab-mpm-benchmark
        cd /tmp/isaaclab-mpm-benchmark/tools/mpm_benchmarks
        python merge_osmo_shards.py \
          --workflow_id "{{workflow_id}}" \
          --output "{{output}}/mpm_benchmark_{{workflow_id}}" \
          --input "{{input:0}}" \
          --input "{{input:1}}" \
          --input "{{input:2}}" \
          --input "{{input:3}}" \
          --input "{{input:4}}" \
          --input "{{input:5}}" \
          --input "{{input:6}}" \
          --input "{{input:7}}"
    inputs:
    - task: shard-pair-00
    - task: shard-pair-01
    - task: shard-pair-02
    - task: shard-pair-03
    - task: shard-pair-04
    - task: shard-pair-05
    - task: shard-pair-06
    - task: shard-pair-07

default-values:
  workflow_name: mpm-benchmark-qualification
  image: nvcr.io/nvidia/isaac-lab:3.0.0-beta2
  benchmark_branch: maximiliank/mpm-benchmark-osmo-20260909
  manifest: osmo_l40s_qualification.toml
  repetitions: 1
