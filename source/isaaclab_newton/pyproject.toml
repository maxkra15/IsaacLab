[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_newton"
version = "0.16.0"
description = "Extension providing IsaacLab with Newton specific abstractions."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "simulation", "newton"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[project.optional-dependencies]
all = [
    "prettytable>=3.3.0",
    "PyOpenGL-accelerate>=3.1.0",
    # RBY1DF's URDF still references a Collada visual mesh. This can be
    # removed once the demo robot is switched to a USD asset.
    "pycollada",
    # Verified upstream Newton PR 2848 commit until the coupled-solver API lands in a release.
    "newton[sim] @ git+https://github.com/newton-physics/newton.git@97d745063ff5556032a09a7c7f5699032f2de053",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_newton", "isaaclab_newton.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
